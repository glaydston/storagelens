name: Release

# Publishes a downloadable StorageLens.zip whenever a v* tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build installer and archive
        run: make dmg zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/StorageLens-*.dmg
            build/StorageLens.zip
          generate_release_notes: true
          body: |
            ## Install

            Download **`StorageLens-<version>.dmg`**, open it, and drag
            StorageLens onto the Applications shortcut. (`StorageLens.zip` is
            the same app without the installer window, if you prefer it.)

            **First launch:** this build is signed ad-hoc rather than notarized,
            so Gatekeeper blocks a plain double-click. Right-click the app in
            Applications → **Open** → **Open**. Once only. Command-line
            equivalent:

            ```sh
            xattr -dr com.apple.quarantine /Applications/StorageLens.app
            ```

            **Optional:** to measure protected folders (Mail, some app
            containers), add StorageLens under System Settings → Privacy &
            Security → Full Disk Access.

            Requires macOS 14 or later. Available in English, Português (Brasil)
            and Español; it follows your system language.
